<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINOX AI - PRINAN SAHA🗿</title>
    <link rel="icon" type="image/png" href="https://placehold.co/100x100/171717/06B6D4?text=A.I">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Define Color Variables */
        :root {
            --color-primary: 6, 182, 212; 
            --color-secondary: 8, 145, 178; 
            --color-glow: 0, 243, 255; 
        }
        .voice-mode {
            --color-primary: 251, 113, 133; 
            --color-secondary: 225, 29, 72; 
            --color-glow: 255, 0, 80; 
        }
        body { font-family: 'JetBrains Mono', monospace; background-color: #000; }
        .text-primary { color: rgb(var(--color-primary)); }
        .border-primary\/30 { border-color: rgba(var(--color-primary), 0.3); }
        .bg-secondary\/30 { background-color: rgba(var(--color-secondary), 0.3); }
        .hover\:bg-secondary\/50:hover { background-color: rgba(var(--color-secondary), 0.5); }
        .shadow-glow { box-shadow: 0 0 10px rgba(var(--color-glow), 0.5); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(var(--color-primary), 0.3); border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(var(--color-primary), 0.6); }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; filter: blur(20px); }
            50% { opacity: 0.6; filter: blur(25px); }
        }
        @keyframes sound-wave {
            0% { height: 3px; }
            50% { height: 15px; }
            100% { height: 3px; }
        }
        .animate-pulse-glow { animation: pulse-glow 3s infinite; background-color: rgba(var(--color-primary), 0.1); }
        .sound-bar { width: 3px; background-color: rgb(var(--color-primary)); animation: sound-wave 1s infinite ease-in-out; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="api/gemini.js"></script>
    <script type="text/babel" src="chat.js"></script>
    <script type="text/babel" src="script.js"></script>
</body>
</html>
